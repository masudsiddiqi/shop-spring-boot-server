server.port=8081
spring.application.name=shop-api
# Without these two lines, "POST /undefinedPath" returns 405 instead of 404: Spring Boot's static-resource
# handler maps "/**" for GET/HEAD only, so a POST to an unknown path is "method not allowed" there.
spring.web.resources.add-mappings=false
spring.mvc.throw-exception-if-no-handler-found=true
# The spec uses "additionalProperties: false", so an unknown JSON field must be rejected (400),
# not silently ignored (Spring Boot's default).
spring.jackson.deserialization.fail-on-unknown-properties=true
# Do not write null fields (for example a product without "description"): "null" is not a valid string in the spec.
spring.jackson.default-property-inclusion=non_null
# The 413 limit is enforced by PayloadSizeFilter (bytes). 10 MiB.
app.max-payload-bytes=10485760
# Let Tomcat read and discard the rest of a rejected oversized body, so the client sees the 413
# instead of a "connection reset" while it is still sending.
server.tomcat.max-swallow-size=-1
# Jackson option: accept a decimal number for an integer field.
# Default is true. Then 1.5 for an integer field is cut to 1 and the request passes.
# false: a decimal for an integer field is rejected as a parsing error (400).
# Example: "stock": 1.5 for an integer field.
# Note: this does not stop a number sent as text ("5"). That needs another option.
spring.jackson.deserialization.accept-float-as-int=false
